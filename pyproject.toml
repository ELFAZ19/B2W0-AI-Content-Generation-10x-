[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-short-pipeline"
version = "0.1.0"
description = "Reproducible multi-model AI short film pipeline built around storyboard.json"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=2.25.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
heritage-film = "pipeline.run:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
